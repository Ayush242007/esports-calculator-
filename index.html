<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xyrex.esp - Premium Tracker</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #141414;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, #0a1f1b, #050505 50%, #050505);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
            position: relative;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        .header {
            text-align: center;
            padding: 1.8rem 1rem;
            background: linear-gradient(to bottom, #1a1a1a, #111);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 0 15px var(--accent-glow);
            transition: text-shadow 0.5s ease;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            background-color: #0f0f0f;
            position: relative;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            user-select: none;
            border-bottom: 2px solid transparent;
        }

        .tab:hover {
            color: #fff;
            background-color: rgba(255,255,255,0.02);
        }

        .tab.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            background-color: rgba(0, 255, 204, 0.05);
        }

        .page-container {
            padding: 1.8rem;
            min-height: 320px;
            position: relative;
        }

        .page {
            display: none;
            animation: slideZoomIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes slideZoomIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .page h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: #fff;
            text-transform: uppercase;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #222;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15), inset 0 2px 5px rgba(0,0,0,0.2);
            transform: translateY(-1px);
        }

        .match-score {
            background: linear-gradient(145deg, #161616, #1c1c1c);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a2a2a;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.4s ease;
        }

        .match-score span.label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-score span.points {
            display: block;
            font-size: 2.5rem;
            color: var(--accent);
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            transition: text-shadow 0.3s ease;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 1.8rem;
            gap: 12px;
        }

        .btn {
            background-color: #252525;
            color: #fff;
            border: 1px solid #333;
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            min-width: 120px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transform-origin: center;
        }

        .btn:hover {
            background-color: #2e2e2e;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            border-color: #444;
        }

        .btn:active {
            transform: scale(0.96) translateY(1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-next {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.15), rgba(0, 200, 160, 0.05));
            color: var(--accent);
            border-color: rgba(0, 255, 204, 0.3);
        }

        .btn-next:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .btn-save {
            background: linear-gradient(135deg, rgba(50, 150, 255, 0.15), rgba(20, 100, 200, 0.05));
            color: #66b2ff;
            border-color: rgba(102, 178, 255, 0.3);
        }

        .btn-save:hover {
            background: #66b2ff;
            color: #000;
            border-color: #66b2ff;
            box-shadow: 0 8px 20px rgba(102, 178, 255, 0.4);
        }
        
        .btn-danger {
            background: rgba(255, 50, 50, 0.1);
            color: #ff5555;
            border-color: rgba(255, 85, 85, 0.3);
        }
        
        .btn-danger:hover {
            background: #ff5555;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 85, 85, 0.4);
        }

        .summary-box {
            text-align: center;
            background: linear-gradient(to bottom, transparent, rgba(0,255,204,0.02));
            padding-bottom: 20px;
            border-radius: 12px;
        }

        .summary-box h2 {
            font-size: 4rem;
            color: var(--accent);
            margin: 10px 0;
            text-shadow: 0 0 25px var(--accent-glow);
            transition: all 0.3s ease;
        }

        @keyframes softPulse {
            0% { transform: scale(1); text-shadow: 0 0 15px var(--accent-glow); }
            50% { transform: scale(1.08); text-shadow: 0 0 35px var(--accent); color: #fff; }
            100% { transform: scale(1); text-shadow: 0 0 15px var(--accent-glow); }
        }
        .pulse-anim { animation: softPulse 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

        .breakdown {
            margin-top: 20px;
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .breakdown p { margin: 5px 0; }
        .breakdown span { color: #fff; font-weight: bold; }

        .history-card {
            background: #181818; 
            border: 1px solid #2a2a2a; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .history-card:hover {
            border-color: #444;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .history-header {
            padding: 15px 18px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #1c1c1c; 
            position: relative;
            z-index: 2;
            transition: background 0.3s ease;
        }

        .history-header:active { background: #222; }

        .chevron {
            color: #66b2ff;
            font-size: 0.8rem;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .chevron.open { transform: rotate(180deg); }

        .history-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            background: #111;
        }
        
        .history-content.open { grid-template-rows: 1fr; }
        .history-inner { overflow: hidden; }
        .history-inner-content { padding: 5px 18px 18px 18px; }

        @media (max-width: 380px) {
            .tab { font-size: 0.75rem; padding: 12px 0; }
            .summary-box h2 { font-size: 3rem; }
            .btn { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Xyrex.esp</h1>
            <p>Esports Score Tracker <span style="color:#00ffcc; font-size: 0.6rem;">● LIVE</span></p>
        </div>

        <div class="tabs" id="tabsContainer"></div>
        <div class="page-container" id="pageContainer"></div>
    </div>

    <!-- FIREBASE MODULE SCRIPT (STABLE VERSION) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCBt7i9mvwCWLjuvNTJj5SZKmS8pdWjDzQ",
            authDomain: "xyrex-esp.firebaseapp.com",
            databaseURL: "https://xyrex-esp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "xyrex-esp",
            storageBucket: "xyrex-esp.firebasestorage.app",
            messagingSenderId: "1075375453640",
            appId: "1:1075375453640:web:f92c15c9212c8d82a37cfd",
            measurementId: "G-04XH478WBL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const analytics = getAnalytics(app);

        // Log an event that the app was opened
        logEvent(analytics, 'app_opened', { app_name: 'Xyrex_Tracker' });
        
        window.squadHistory = [];

        onValue(ref(db, 'matches'), (snapshot) => {
            const data = snapshot.val();
            const newHistory = [];
            
            for (let id in data) {
                newHistory.push({ firebaseId: id, ...data[id] });
            }
            
            newHistory.sort((a, b) => b.id - a.id);
            window.squadHistory = newHistory.slice(0, 10);
            
            if(document.getElementById('storagePreview').style.display === 'block') {
                window.updateStorageView();
            }
        });

        window.pushToCloud = async (trackingData) => {
            await push(ref(db, 'matches'), trackingData);
            logEvent(analytics, 'match_saved', { total_score: trackingData.total });
        };

        window.deleteFromCloud = async (firebaseId) => {
            await remove(ref(db, 'matches/' + firebaseId));
        };
    </script>

    <!-- UI & LOGIC SCRIPT -->
    <script>
        let audioCtx;
        function playTypeSound() {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        const pointMap = { 1:12, 2:9, 3:8, 4:7, 5:6, 6:5, 7:4, 8:3, 9:2, 10:1, 11:0, 12:0 };

        const tabsContainer = document.getElementById('tabsContainer');
        const pageContainer = document.getElementById('pageContainer');

        window.switchPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            document.querySelector('.tab[data-target="' + pageId + '"]').classList.add('active');
            
            playTypeSound();
        };

        function initApp() {
            for (let i = 1; i <= 6; i++) {
                tabsContainer.innerHTML += '<div class="tab ' + (i===1?'active':'') + '" data-target="page-' + i + '" onclick="switchPage(\'page-' + i + '\')">M' + i + '</div>';
            }
            tabsContainer.innerHTML += '<div class="tab" data-target="page-total" onclick="switchPage(\'page-total\')">TOT</div>';

            for (let i = 1; i <= 6; i++) {
                let prevBtn = i > 1 ? '<button class="btn" onclick="switchPage(\'page-' + (i-1) + '\')">Back</button>' : '<div style="flex:1"></div>';
                let nextBtn = i < 6 ? '<button class="btn btn-next" onclick="switchPage(\'page-' + (i+1) + '\')">Next Match</button>' : '<button class="btn btn-next" onclick="switchPage(\'page-total\')">View Total</button>';

                pageContainer.innerHTML += `
                    <div class="page ${i===1?'active':''}" id="page-${i}">
                        <h3>Round ${i}</h3>
                        <div class="input-group">
                            <label>Placement (1-12)</label>
                            <select class="placement-select" data-match="${i}">
                                <option value="0" disabled selected>Select Position...</option>
                                <option value="1">1st Place (Booyah!)</option>
                                <option value="2">2nd Place</option>
                                <option value="3">3rd Place</option>
                                <option value="4">4th Place</option>
                                <option value="5">5th Place</option>
                                <option value="6">6th Place</option>
                                <option value="7">7th Place</option>
                                <option value="8">8th Place</option>
                                <option value="9">9th Place</option>
                                <option value="10">10th Place</option>
                                <option value="11">11th Place</option>
                                <option value="12">12th Place</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Total Eliminations (Kills)</label>
                            <input type="number" class="kills-input" data-match="${i}" placeholder="Enter total kills..." min="0">
                        </div>
                        <div class="match-score">
                            <span class="label">Points Earned:</span>
                            <span class="points" id="matchTotal${i}">0</span>
                        </div>
                        <div class="nav-buttons">
                            ${prevBtn}
                            ${nextBtn}
                        </div>
                    </div>
                `;
            }

            pageContainer.innerHTML += `
                <div class="page" id="page-total">
                    <div class="input-group" style="margin-bottom: 20px; text-align: center;">
                        <label style="color: var(--accent); font-weight: bold;">Lobby / Match Time</label>
                        <input type="time" id="global-lobby-time" style="max-width: 200px; text-align: center; margin: 0 auto; display: block;">
                    </div>

                    <div class="summary-box">
                        <h3 style="margin-bottom:0; color: #aaa; text-transform:uppercase; font-size:1rem; letter-spacing: 2px;">Grand Total</h3>
                        <h2 id="grandTotalDisplay">0</h2>
                        
                        <div class="breakdown">
                            <p>M1: <span id="sum1">0</span> &nbsp;|&nbsp; M2: <span id="sum2">0</span> &nbsp;|&nbsp; M3: <span id="sum3">0</span></p>
                            <p>M4: <span id="sum4">0</span> &nbsp;|&nbsp; M5: <span id="sum5">0</span> &nbsp;|&nbsp; M6: <span id="sum6">0</span></p>
                        </div>
                    </div>
                    
                    <div class="nav-buttons" style="margin-top: 25px;">
                        <button class="btn btn-save" onclick="manualSave()">Cloud Save Sync</button>
                        <button class="btn btn-save" onclick="toggleStorageView()">View Live History</button>
                    </div>

                    <div id="storagePreview" style="display:none; margin-top: 20px;"></div>

                    <div class="nav-buttons" style="margin-top: 20px;">
                        <button class="btn" onclick="switchPage('page-6')" style="width: 100%;">Back to M6</button>
                    </div>
                </div>
            `;
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                obj.innerHTML = Math.floor(ease * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function triggerPulse(elId) {
            const el = document.getElementById(elId);
            if(el) {
                el.classList.remove('pulse-anim');
                void el.offsetWidth; 
                el.classList.add('pulse-anim');
            }
        }

        function calculateScores() {
            let grandTotal = 0;
            const grandTotalEl = document.getElementById('grandTotalDisplay');
            let currentTotal = parseInt(grandTotalEl.textContent) || 0;
            
            for (let i = 1; i <= 6; i++) {
                const select = document.querySelector('.placement-select[data-match="' + i + '"]');
                const input = document.querySelector('.kills-input[data-match="' + i + '"]');
                
                const pos = parseInt(select.value) || 0;
                const placementPts = pointMap[pos] || 0;
                const kills = parseInt(input.value) || 0;
                
                const matchScore = placementPts + kills;
                const matchEl = document.getElementById('matchTotal' + i);
                let currentMatchTotal = parseInt(matchEl.textContent) || 0;
                
                if (currentMatchTotal !== matchScore) {
                    animateValue(matchEl, currentMatchTotal, matchScore, 600);
                    triggerPulse('matchTotal' + i);
                }
                
                document.getElementById('sum' + i).textContent = matchScore;
                grandTotal += matchScore;
            }
            
            if (currentTotal !== grandTotal) {
                animateValue(grandTotalEl, currentTotal, grandTotal, 800);
                triggerPulse('grandTotalDisplay');
            }
        }

        window.manualSave = function() {
            playTypeSound();
            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const trackingData = {
                id: Date.now(),
                saveDate: dateStr,
                lobbyTime: document.getElementById('global-lobby-time').value,
                total: document.getElementById('grandTotalDisplay').textContent,
                matches: {}
            };
            
            for (let i = 1; i <= 6; i++) {
                trackingData.matches[i] = {
                    placement: document.querySelector('.placement-select[data-match="' + i + '"]').value,
                    kills: document.querySelector('.kills-input[data-match="' + i + '"]').value
                };
            }
            
            if(window.pushToCloud) {
                window.pushToCloud(trackingData).then(() => {
                    alert("Match data synced to squad cloud!");
                }).catch(err => {
                    alert("Failed to sync. Check console.");
                    console.error(err);
                });
            }
        }

        window.loadRecord = function(firebaseId) {
            playTypeSound();
            const record = window.squadHistory.find(r => r.firebaseId === firebaseId);
            if (record) {
                if (record.lobbyTime) document.getElementById('global-lobby-time').value = record.lobbyTime;
                for (let i = 1; i <= 6; i++) {
                    if (record.matches[i]) {
                        document.querySelector('.placement-select[data-match="' + i + '"]').value = record.matches[i].placement || "0";
                        document.querySelector('.kills-input[data-match="' + i + '"]').value = record.matches[i].kills || "";
                    }
                }
                calculateScores();
                alert("Tracker updated with cloud data!");
            }
        }

        window.deleteRecord = function(firebaseId) {
            playTypeSound();
            if(confirm("Delete this saved match record for the whole squad?")) {
                if(window.deleteFromCloud) {
                    window.deleteFromCloud(firebaseId);
                }
            }
        }

        window.updateStorageView = function() {
            const previewEl = document.getElementById('storagePreview');
            const history = window.squadHistory || [];
            
            if (history.length === 0) {
                previewEl.innerHTML = "<div class='breakdown' style='text-align:center; color:#ff5555; border-color:#552222;'>No cloud records currently saved.</div>";
                return;
            }

            let html = `<div style="color: #66b2ff; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; font-size: 0.85rem; text-align: center; letter-spacing: 1px;">Live Cloud History (Top 10)</div>`;

            history.forEach(data => {
                let timeDisplay = data.lobbyTime || 'Not Set';
                if(timeDisplay !== 'Not Set' && timeDisplay.includes(':')) {
                    const parts = timeDisplay.split(':');
                    let hr = parseInt(parts[0]);
                    const ampm = hr >= 12 ? 'PM' : 'AM';
                    hr = hr % 12 || 12;
                    timeDisplay = hr + ":" + parts[1] + " " + ampm;
                }

                html += `
                <div class="history-card">
                    <div class="history-header" onclick="toggleRecord('${data.firebaseId}')">
                        <div style="display:flex; align-items:center; gap: 12px;">
                            <div class="chevron" id="chevron-${data.firebaseId}">▼</div>
                            <div>
                                <div style="font-size: 0.75rem; color: #888; margin-bottom: 4px;">${data.saveDate}</div>
                                <div style="color: #fff; font-weight: bold; font-size: 0.95rem; letter-spacing: 0.5px;">Lobby: <span style="color:#00ffcc">${timeDisplay}</span></div>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px;">Total</div>
                            <div style="color: #00ffcc; font-size: 1.4rem; font-weight: bold; margin-top: 2px;">${data.total}</div>
                        </div>
                    </div>
                    <div id="record-${data.firebaseId}" class="history-content">
                        <div class="history-inner">
                            <div class="history-inner-content">
                `;
                
                for(let i = 1; i <= 6; i++) {
                    if(data.matches && data.matches[i]) {
                        const pos = parseInt(data.matches[i].placement) || 0;
                        const kills = parseInt(data.matches[i].kills) || 0;
                        const pts = (pointMap[pos] || 0) + kills;
                        const posDisplay = pos > 0 ? (pos + 'th') : '-';
                        const suffixPos = posDisplay.replace('1th','1st').replace('2th','2nd').replace('3th','3rd');

                        html += `<div style="display:flex; justify-content:space-between; border-bottom: 1px solid #222; padding: 10px 0; font-size: 0.85rem;">
                                    <span style="color:#aaa">Match ${i}: <span style="color:#fff">${suffixPos} | ${kills} Kills</span></span>
                                    <span style="color:var(--accent); font-weight: bold;">${pts} pts</span>
                                 </div>`;
                    }
                }

                html += `
                                <div style="margin-top: 18px; display: flex; gap: 10px;">
                                    <button class="btn btn-save" style="padding: 10px; font-size: 0.75rem; flex: 2;" onclick="loadRecord('${data.firebaseId}')">Load Tracker</button>
                                    <button class="btn btn-danger" style="padding: 10px; font-size: 0.75rem; flex: 1; min-width: auto;" onclick="deleteRecord('${data.firebaseId}')">Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            previewEl.innerHTML = html;
        }

        window.toggleRecord = function(firebaseId) {
            playTypeSound();
            const content = document.getElementById('record-' + firebaseId);
            const chevron = document.getElementById('chevron-' + firebaseId);
            if(content.classList.contains('open')) {
                content.classList.remove('open');
                chevron.classList.remove('open');
            } else {
                content.classList.add('open');
                chevron.classList.add('open');
            }
        }

        window.toggleStorageView = function() {
            playTypeSound();
            const previewEl = document.getElementById('storagePreview');
            if(previewEl.style.display === 'none' || previewEl.style.display === '') {
                window.updateStorageView();
                previewEl.style.display = 'block';
                previewEl.style.animation = 'slideZoomIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards';
            } else {
                previewEl.style.display = 'none';
            }
        }

        initApp();
        
        document.querySelectorAll('.placement-select').forEach(element => {
            element.addEventListener('change', () => { calculateScores(); playTypeSound(); });
        });
        document.querySelectorAll('.kills-input').forEach(element => {
            element.addEventListener('input', () => { calculateScores(); playTypeSound(); });
        });
    </script>
</body>
</html>
