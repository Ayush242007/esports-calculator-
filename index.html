<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xyrex.esp - Mobile Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --container-bg: rgba(15, 15, 20, 0.85);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.5);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .bg-animation {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, #111122 0%, var(--bg-color) 40%);
            background-size: 100% 100%;
            animation: pulseBg 10s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .mobile-app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 1.5rem 1rem 1rem;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header h1 {
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .header h1 span { color: var(--accent); }

        .header p {
            color: var(--accent);
            margin-top: 2px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            background: rgba(10, 10, 15, 0.95);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            z-index: 10;
        }

        .tabs::-webkit-scrollbar { display: none; }
        .tabs { -ms-overflow-style: none; scrollbar-width: none; }

        .tab {
            flex: 0 0 auto;
            width: 25%;
            text-align: center;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            position: relative;
            scroll-snap-align: start;
            transition: color 0.3s ease;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            width: 0; height: 3px;
            background: var(--accent);
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 3px 3px 0 0;
        }

        .tab.active {
            color: var(--accent);
            background: linear-gradient(to top, rgba(0,255,204,0.08), transparent);
        }

        .tab.active::after {
            width: 80%;
            box-shadow: 0 -2px 10px var(--accent-glow);
        }

        .view-portal {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .slider-track {
            display: flex;
            height: 100%;
            width: 700vw;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .page {
            width: 100vw;
            height: 100%;
            padding: 1.5rem 1.5rem 6rem 1.5rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page::-webkit-scrollbar { display: none; }

        .page h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .page h3::before {
            content: '';
            display: inline-block;
            width: 6px; height: 20px;
            background: var(--accent);
            margin-right: 10px;
            border-radius: 4px;
        }

        .input-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300ffcc%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        select option { background-color: #0c0c12; }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(0, 255, 204, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .match-score {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.4) 100%);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(0,255,204,0.15);
            margin-top: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .match-score span.label {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .match-score span.points {
            display: block;
            font-size: 3.5rem;
            color: var(--accent);
            font-weight: 700;
            text-shadow: 0 0 20px var(--accent-glow);
            line-height: 1.1;
            margin-top: 5px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s active;
        }

        .btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-next {
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent);
            border-color: rgba(0, 255, 204, 0.3);
        }

        .btn-next:active {
            background: var(--accent);
            color: #000;
        }

        .summary-box { text-align: center; padding-top: 10px; }
        .summary-box h3 { justify-content: center; color: var(--text-muted); font-size: 1.2rem;}
        .summary-box h2 {
            font-size: 5.5rem;
            color: var(--text-main);
            margin: 10px 0 20px 0;
            line-height: 1;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .breakdown {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            font-size: 1.1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .breakdown-item {
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 8px;
        }
        
        .breakdown-item span { 
            color: var(--accent); 
            font-weight: 700; 
            font-size: 1.4rem; 
            display: block;
        }

        #welcomeModal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .modal-content {
            background: rgba(15, 15, 20, 0.9);
            padding: 3rem 2rem;
            border-radius: 20px;
            border: 1px solid var(--accent);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
        }

    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div id="welcomeModal">
        <div class="modal-content">
            <h1 style="color:var(--accent); font-size: 3rem; margin:0 0 10px; text-transform:uppercase; text-shadow: 0 0 20px var(--accent-glow);">Xyrex.esp</h1>
            <p style="font-size: 1rem; margin-bottom: 30px; color:var(--text-muted); text-transform:uppercase; letter-spacing:2px;">Mobile Interface</p>
            <button class="btn btn-next" style="width: 100%; font-size: 1.2rem; padding: 18px;" onclick="startApp()">Enter Tracker</button>
        </div>
    </div>

    <div class="mobile-app">
        <div class="header">
            <h1>Xyrex<span>.esp</span></h1>
            <p>Free Fire MAX</p>
        </div>

        <div class="tabs" id="tabsContainer"></div>
        
        <div class="view-portal">
            <div class="slider-track" id="sliderTrack">
                <!-- Pages injected via JS -->
            </div>
        </div>
    </div>

    <script>
        let audioCtx;
        function playTypeSound(freq = 800, dur = 0.08, vol = 0.05) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + dur);
                
                gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        function startApp() {
            playTypeSound(1200, 0.3, 0.1);
            const modal = document.getElementById('welcomeModal');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 400);
        }

        const pointMap = { 1:12, 2:9, 3:8, 4:7, 5:6, 6:5, 7:4, 8:3, 9:2, 10:1, 11:0, 12:0 };
        const tabsContainer = document.getElementById('tabsContainer');
        const sliderTrack = document.getElementById('sliderTrack');
        
        window.switchPage = function(index) {
            playTypeSound();
            const offset = -(index * 100);
            sliderTrack.style.transform = `translateX(${offset}vw)`;
            
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            
            const activeTab = document.querySelectorAll('.tab')[index];
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        };

        function buildUI() {
            for (let i = 0; i < 6; i++) {
                tabsContainer.innerHTML += `<div class="tab ${i===0?'active':''}" onclick="switchPage(${i})">M${i+1}</div>`;
            }
            tabsContainer.innerHTML += `<div class="tab" onclick="switchPage(6)">TOT</div>`;

            for (let i = 1; i <= 6; i++) {
                let prevBtn = i > 1 ? `<button class="btn" onclick="switchPage(${i-2})">Back</button>` : `<div></div>`;
                let nextBtn = i < 6 ? `<button class="btn btn-next" onclick="switchPage(${i})">Next</button>` : `<button class="btn btn-next" onclick="switchPage(6)">Total</button>`;

                sliderTrack.innerHTML += `
                    <div class="page">
                        <h3>Round 0${i}</h3>
                        <div class="input-group">
                            <label>Placement (1-12)</label>
                            <select class="placement-select" data-match="${i}">
                                <option value="0" disabled selected>Select Position...</option>
                                <option value="1">1st Place (Booyah!)</option>
                                <option value="2">2nd Place</option>
                                <option value="3">3rd Place</option>
                                <option value="4">4th Place</option>
                                <option value="5">5th Place</option>
                                <option value="6">6th Place</option>
                                <option value="7">7th Place</option>
                                <option value="8">8th Place</option>
                                <option value="9">9th Place</option>
                                <option value="10">10th Place</option>
                                <option value="11">11th Place</option>
                                <option value="12">12th Place</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Team Kills <span style="text-transform:none; font-size: 0.85rem; color:var(--text-muted);">(Yogit, Raghav, Jay, Ayush)</span></label>
                            <input type="text" class="team-kills-input" data-match="${i}" placeholder="Example: 4 2 0 1" autocomplete="off">
                            <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 5px;">Type 4 numbers separated by space.</small>
                        </div>
                        <div class="match-score">
                            <span class="label">Points Earned</span>
                            <span class="points" id="matchTotal${i}">0</span>
                        </div>
                        <div class="nav-buttons">
                            ${prevBtn}
                            ${nextBtn}
                        </div>
                    </div>
                `;
            }

            // Build Page (Total)
            sliderTrack.innerHTML += `
                <div class="page">
                    <div class="summary-box">
                        <h3>TOURNAMENT TOTAL</h3>
                        <h2 id="grandTotalDisplay">0</h2>
                        
                        <h3 style="justify-content: center; margin-top: 10px;">PLAYER KILLS</h3>
                        <div class="breakdown">
                            <div class="breakdown-item" style="color: var(--text-main);">Yogit <span id="tot-yogit">0</span></div>
                            <div class="breakdown-item" style="color: var(--text-main);">Raghav <span id="tot-raghav">0</span></div>
                            <div class="breakdown-item" style="color: var(--text-main);">Jay <span id="tot-jay">0</span></div>
                            <div class="breakdown-item" style="color: var(--text-main);">Ayush <span id="tot-ayush">0</span></div>
                        </div>

                        <h3 style="justify-content: center; margin-top: 10px;">MATCH SCORES</h3>
                        <div class="breakdown">
                            <div class="breakdown-item">Match 1 <span id="sum1">0</span></div>
                            <div class="breakdown-item">Match 2 <span id="sum2">0</span></div>
                            <div class="breakdown-item">Match 3 <span id="sum3">0</span></div>
                            <div class="breakdown-item">Match 4 <span id="sum4">0</span></div>
                            <div class="breakdown-item">Match 5 <span id="sum5">0</span></div>
                            <div class="breakdown-item">Match 6 <span id="sum6">0</span></div>
                        </div>
                    </div>
                    <div class="nav-buttons" style="justify-content: center; margin-top: 20px;">
                        <button class="btn" style="flex: none; width: 80%;" onclick="switchPage(5)">Return to Matches</button>
                    </div>
                </div>
            `;
        }

        function calculateScores() {
            let grandTotal = 0;
            let playerKills = { yogit: 0, raghav: 0, jay: 0, ayush: 0 };
            
            for (let i = 1; i <= 6; i++) {
                const select = document.querySelector(`.placement-select[data-match="${i}"]`);
                const inputVal = document.querySelector(`.team-kills-input[data-match="${i}"]`).value.trim();
                
                // Extracts all numbers from the input string (e.g. "4 2 1 0" -> [4, 2, 1, 0])
                const killsArray = inputVal.match(/\d+/g) || [];
                
                // Assign to players strictly in order: Yogit(0), Raghav(1), Jay(2), Ayush(3)
                const yKills = parseInt(killsArray[0]) || 0;
                const rKills = parseInt(killsArray[1]) || 0;
                const jKills = parseInt(killsArray[2]) || 0;
                const aKills = parseInt(killsArray[3]) || 0;
                
                const totalTeamKills = yKills + rKills + jKills + aKills;
                
                playerKills.yogit += yKills;
                playerKills.raghav += rKills;
                playerKills.jay += jKills;
                playerKills.ayush += aKills;
                
                const pos = parseInt(select.value) || 0;
                const placementPts = pointMap[pos] || 0;
                
                const matchScore = placementPts + totalTeamKills;
                
                const scoreDisplay = document.getElementById(`matchTotal${i}`);
                if (parseInt(scoreDisplay.textContent) !== matchScore) {
                    scoreDisplay.style.transform = 'scale(1.2)';
                    setTimeout(() => scoreDisplay.style.transform = 'scale(1)', 150);
                }
                scoreDisplay.style.transition = 'transform 0.15s ease';
                
                scoreDisplay.textContent = matchScore;
                document.getElementById(`sum${i}`).textContent = matchScore;
                
                grandTotal += matchScore;
            }
            
            document.getElementById('grandTotalDisplay').textContent = grandTotal;
            document.getElementById('tot-yogit').textContent = playerKills.yogit;
            document.getElementById('tot-raghav').textContent = playerKills.raghav;
            document.getElementById('tot-jay').textContent = playerKills.jay;
            document.getElementById('tot-ayush').textContent = playerKills.ayush;
        }

        buildUI();
        
        document.querySelectorAll('.placement-select').forEach(element => {
            element.addEventListener('change', () => { calculateScores(); playTypeSound(); });
        });

        // Listen for typing in the new single input field
        document.querySelectorAll('.team-kills-input').forEach(element => {
            element.addEventListener('input', () => { calculateScores(); playTypeSound(); });
        });
    </script>
</body>
</html>
